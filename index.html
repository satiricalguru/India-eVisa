    const PORTS = [

    function App() {
      // Views: 'home' | 'eligibility' | 'login' | 'wizard' | 'review' | 'payment' | 'tracking'
      const [view, setView] = useState('home');
      const [user, setUser] = useState({ loggedIn: false, email: '' });

      // Eligibility State
      const [eligibility, setEligibility] = useState({

        purpose: 'tourism',
        duration: '30_days',
        port: 'DEL'
      });
      const [eligibilityDone, setEligibilityDone] = useState(false);

      // Form Wizard State
      const [wizardStep, setWizardStep] = useState(1);
      const [formData, setFormData] = useState({
        givenName: 'MARCUS',
        surname: 'VANCE',
        passportNumber: '481920311',
        dob: '1988-11-18',
        gender: 'Male',
        issueDate: '2022-04-10',
        expiryDate: '2032-04-09',
        nationality: 'United Kingdom',
        email: 'marcus.vance@example.co.uk',
        phone: '+44 7700 900123',
        portOfEntry: 'DEL',
        addressInIndia: 'Taj Mahal Hotel, Mansingh Road, New Delhi 110011',
        docScanned: true,
        photoScanned: true,
        aiPassScore: 98
      });

      // Tracking state: 'under_review' | 'granted'
      const [trackingStatus, setTrackingStatus] = useState('under_review');
      const [appId, setAppId] = useState('ETV-2026-98312');

      // AI Inspection states
      const [isAnalyzingDoc, setIsAnalyzingDoc] = useState(false);
      const [docCheckResult, setDocCheckResult] = useState({
        valid: true,
        score: 98,
        mrzFound: true,
        validityMonths: 68,
        message: "Passport bio-page verified. High clarity MRZ, >6 months validity confirmed."
      });

      const selectedNat = NATIONALITIES.find(n => n.code === eligibility.nationality) || NATIONALITIES[0];

      // Download vector PDF pass
      const downloadOfficialEta = () => {
        const canvas = document.createElement('canvas');
        canvas.width = 1200;
        canvas.height = 1700;
        const ctx = canvas.getContext('2d');
        
        // Background
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, 1200, 1700);

        // Border
        ctx.strokeStyle = '#0c1a30';
        ctx.lineWidth = 10;
        ctx.strokeRect(40, 40, 1120, 1620);
        ctx.strokeStyle = '#f97316';
        ctx.lineWidth = 3;
        ctx.strokeRect(52, 52, 1096, 1596);

        // Header
        ctx.fillStyle = '#0c1a30';
        ctx.font = 'bold 36px Georgia, serif';
        ctx.textAlign = 'center';
        ctx.fillText('GOVERNMENT OF INDIA', 600, 130);
        ctx.font = '22px Arial, sans-serif';
        ctx.fillText('MINISTRY OF HOME AFFAIRS · IMMIGRATION BUREAU', 600, 170);
        ctx.font = '16px Arial, sans-serif';
        ctx.fillStyle = '#64748b';
        ctx.fillText('e-Visa Services Division · New Delhi', 600, 200);

        // Ribbon
        ctx.fillStyle = '#0c1a30';
        ctx.fillRect(80, 230, 1040, 56);
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 24px Arial, sans-serif';
        ctx.fillText('ELECTRONIC TRAVEL AUTHORISATION (ETA)', 600, 268);

        // Status Box
        ctx.fillStyle = '#dcfce7';
        ctx.fillRect(80, 320, 1040, 100);
        ctx.strokeStyle = '#16a34a';
        ctx.lineWidth = 2;
        ctx.strokeRect(80, 320, 1040, 100);

        ctx.fillStyle = '#15803d';
        ctx.font = 'bold 32px Arial, sans-serif';
        ctx.textAlign = 'left';
        ctx.fillText('STATUS: GRANTED', 110, 382);

        ctx.fillStyle = '#0f172a';
        ctx.font = 'bold 18px Arial, sans-serif';
        ctx.fillText('APPLICATION ID: ' + appId, 600, 365);
        ctx.fillText('ETA NUMBER: IN26ETV00928341', 600, 395);

        // Grid Details
        ctx.fillStyle = '#f8fafc';
        ctx.fillRect(80, 450, 1040, 480);
        ctx.strokeStyle = '#cbd5e1';
        ctx.strokeRect(80, 450, 1040, 480);

        const rows = [
          ['Full Name (as in Passport):', formData.givenName + ' ' + formData.surname, 'Passport Number:', formData.passportNumber],
          ['Nationality / Citizenship:', selectedNat.name, 'Date of Birth:', formData.dob],
          ['Gender / Age:', formData.gender + ' / Adult', 'Place of Issue:', selectedNat.name],
          ['Visa Subcategory:', 'e-Tourist Visa (30 Days)', 'Number of Entries:', 'Double Entry (30 Days)'],
          ['Date of Issue:', '29 Aug 2026', 'Valid Until:', '28 Sep 2026'],
          ['Permitted Ports of Entry:', '28 Designated Airports & 5 Seaports in India', 'Stay Duration:', '30 Days from date of arrival']
        ];

        let yPos = 500;
        rows.forEach(r => {
          ctx.fillStyle = '#64748b';
          ctx.font = 'bold 16px Arial, sans-serif';
          ctx.fillText(r[0], 110, yPos);
          ctx.fillStyle = '#0f172a';
          ctx.font = 'bold 17px Arial, sans-serif';
          ctx.fillText(r[1], 370, yPos);

          ctx.fillStyle = '#64748b';
          ctx.font = 'bold 16px Arial, sans-serif';
          ctx.fillText(r[2], 620, yPos);
          ctx.fillStyle = '#0f172a';
          ctx.font = 'bold 17px Arial, sans-serif';
          ctx.fillText(r[3], 830, yPos);

          yPos += 70;
        });

        // Instructions
        ctx.fillStyle = '#0c1a30';
        ctx.font = 'bold 18px Arial, sans-serif';
        ctx.fillText('IMPORTANT INSTRUCTIONS FOR TRAVELER:', 80, 990);
        ctx.fillStyle = '#334155';
        ctx.font = '15px Arial, sans-serif';
        const instructions = [
          '1. Carry a printed physical copy of this Electronic Travel Authorisation (ETA) at all times.',
          '2. Passport must have at least 6 months validity from arrival date with 2 blank pages.',
          '3. Biometrics (fingerprints & photo) will be mandatorily captured upon arrival at Indian Immigration.',
          '4. This e-Visa is strictly non-extendable, non-convertible, and not valid for restricted/cantonment areas.',
          '5. 24x7 Support: indian-evisa@gov.in | Official Portal: https://indianvisaonline.gov.in'
        ];
        instructions.forEach((ins, idx) => {
          ctx.fillText(ins, 80, 1030 + idx * 35);
        });

        // Verification Footer Seal
        ctx.fillStyle = '#059669';
        ctx.beginPath();
        ctx.arc(600, 1340, 70, 0, Math.PI * 2);
        ctx.stroke();
        ctx.font = 'bold 14px Arial, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('IMMIGRATION BUREAU', 600, 1330);
        ctx.fillText('VERIFIED & APPROVED', 600, 1350);
        ctx.fillText('GOVT OF INDIA', 600, 1370);

        // Bottom Disclaimer
        ctx.fillStyle = '#94a3b8';
        ctx.font = '13px Arial, sans-serif';
        ctx.fillText('Official Prototype Generated for "Build What Moves India" Hackathon · Powered by GPT-5.6 Luna & Terra', 600, 1580);

        // Convert to Download
        const link = document.createElement('a');
        link.download = 'India-eVisa-ETA-' + appId + '.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
      };

      return (
        <div className="flex flex-col min-h-screen">

                  className="hidden md:inline-block text-xs font-semibold text-slate-200 hover:text-orange-400 transition"

                  onClick={() => {

                  className="text-xs font-semibold px-3 py-1.5 rounded bg-slate-800 hover:bg-slate-700 border border-slate-600 transition"
                >
                  📍 {view === 'tracking' ? 'Back to Portal' : 'Track Status'}
                </button>
                {user.loggedIn ? (
                  <div className="text-xs bg-emerald-950 text-emerald-300 border border-emerald-700 px-3 py-1.5 rounded-full font-medium flex items-center space-x-1">
                    <span className="w-2 h-2 rounded-full bg-emerald-400 inline-block"></span>
                    <span>{user.email}</span>
                  </div>
                ) : (

                    onClick={() => setView('login')}

                  </button>

            </div>

            {/* VIEW 1: HOME LANDING */}
            {view === 'home' && (
              <div className="space-y-12">
                {/* Hero Section */}
                <div className="bg-gradient-to-br from-[#0c1a30] to-[#1e293b] rounded-2xl p-8 md:p-12 text-white shadow-xl relative overflow-hidden">
                  <div className="max-w-2xl relative z-10 space-y-6">

                      <span>✨ Next-Gen Indian Visa Redesign</span>
                    </div>

                    <p className="text-slate-300 text-base md:text-lg leading-relaxed">
                      Apply for your 30-Day Indian e-Tourist Visa in under 5 minutes. Real-time AI document inspection, 
                      upfront transparent fees, and guaranteed status tracking.
                    </p>
                    <div className="flex flex-wrap gap-4 pt-2">
                      <button

                  <div className="hidden lg:block absolute right-8 top-1/2 -translate-y-1/2 w-80 bg-white/10 backdrop-blur-md rounded-xl p-6 border border-white/20 shadow-2xl">
                    <div className="text-xs uppercase font-bold tracking-wider text-orange-400 mb-2">Live Route Preview</div>
                    <div className="text-2xl font-bold mb-4">London 🇬🇧 ➔ New Delhi 🇮🇳</div>
                    <div className="space-y-3 text-xs text-slate-200">
                      <div className="flex justify-between border-b border-white/10 pb-2">
                        <span>Visa Type:</span>
                        <strong className="text-white">e-Tourist (30 Days)</strong>
                      </div>
                      <div className="flex justify-between border-b border-white/10 pb-2">
                        <span>Transparent Fee:</span>
                        <strong className="text-emerald-400 font-bold">₹2,399 ($25 USD)</strong>
                      </div>
                      <div className="flex justify-between border-b border-white/10 pb-2">

                      </div>
                      <div className="flex justify-between">
                        <span>Documents Needed:</span>
                        <strong className="text-white">Passport + Photo</strong>

                  </div>
                </div>

                {/* 3 Pillars of Innovation */}

                  <div className="bg-white p-6 rounded-xl border border-slate-200 shadow-sm hover:shadow-md transition">
                    <div className="text-3xl mb-3">🧭</div>
                    <h3 className="font-bold text-lg text-slate-900 mb-2">1. Upfront Route Match</h3>
                    <p className="text-sm text-slate-600 leading-relaxed">
                      No more navigating 9 ambiguous categories. 4 simple questions tell you if you are eligible and provide an exact cost before touching any form.
                    </p>
                  </div>

                  <div className="bg-white p-6 rounded-xl border border-slate-200 shadow-sm hover:shadow-md transition">
                    <div className="text-3xl mb-3">👁️</div>

                  </div>

                  <div className="bg-white p-6 rounded-xl border border-slate-200 shadow-sm hover:shadow-md transition">
                    <div className="text-3xl mb-3">💳</div>
                    <h3 className="font-bold text-lg text-slate-900 mb-2">3. One Transparent Fee</h3>

                      No hidden 3.5% SBI ePay surcharges or exposed banking gateways. Single, guaranteed pricing with instant card checkout and downloadable ETA pass.
                    </p>
                  </div>

            )}

            {/* VIEW 2: ELIGIBILITY CHECKER */}
            {view === 'eligibility' && (
              <div className="max-w-2xl mx-auto bg-white rounded-2xl border border-slate-200 p-8 shadow-sm space-y-6">
                <div className="border-b border-slate-100 pb-4">
                  <h2 className="text-2xl font-bold text-slate-900">Step 1: Check Your Visa Eligibility</h2>
                  <p className="text-sm text-slate-500 mt-1">Answer 4 quick questions to get your personalized checklist and price guarantee.</p>
                </div>

                <div className="space-y-5">
                  <div>
                    <label className="block text-sm font-bold text-slate-700 mb-2">1. What is your nationality as shown on your passport?</label>
                    <select 
                      value={eligibility.nationality} 
                      onChange={e => setEligibility({ ...eligibility, nationality: e.target.value })}
                      className="w-full border border-slate-300 rounded-lg p-3 text-sm focus:ring-2 focus:ring-orange-500 focus:outline-none bg-slate-50"
                    >
                      {NATIONALITIES.map(nat => (
                        <option key={nat.code} value={nat.code}>
                          {nat.flag} {nat.name} ({nat.fee === 0 ? 'Free Fee Waiver' : '₹' + nat.fee.toLocaleString()})
                        </option>
                      ))}
                    </select>
                  </div>

                  <div>
                    <label className="block text-sm font-bold text-slate-700 mb-2">2. What is the primary purpose of your visit?</label>
                    <div className="grid grid-cols-2 gap-3">
                      <button 
                        type="button" 
                        onClick={() => setEligibility({ ...eligibility, purpose: 'tourism' })}

                      >

                      </button>
                      <button 
                        type="button" 
                        onClick={() => setEligibility({ ...eligibility, purpose: 'business' })}
                        className={`p-3 rounded-lg border text-sm font-semibold text-left transition ${eligibility.purpose === 'business' ? 'border-orange-500 bg-orange-50 text-orange-900' : 'border-slate-200 bg-slate-50'}`}

                      </button>

                  <div>
                    <label className="block text-sm font-bold text-slate-700 mb-2">3. How long do you plan to stay in India?</label>
                    <div className="grid grid-cols-2 gap-3">
                      <button 
                        type="button" 
                        onClick={() => setEligibility({ ...eligibility, duration: '30_days' })}
                        className={`p-3 rounded-lg border text-sm font-semibold text-left transition ${eligibility.duration === '30_days' ? 'border-orange-500 bg-orange-50 text-orange-900' : 'border-slate-200 bg-slate-50'}`}
                      >

                      <button 
                        type="button" 
                        onClick={() => setEligibility({ ...eligibility, duration: '1_year' })}
                        className={`p-3 rounded-lg border text-sm font-semibold text-left transition ${eligibility.duration === '1_year' ? 'border-orange-500 bg-orange-50 text-orange-900' : 'border-slate-200 bg-slate-50'}`}

            {/* VIEW 3: DEMO LOGIN (OTP) */}
            {view === 'login' && (

                  <div className="text-3xl">🔐</div>

                  </div>

                  <div className="bg-amber-50 border border-amber-200 rounded-lg p-3 text-xs text-amber-900">
                    💡 <strong>Hackathon Demo Mode:</strong> Use demo verification code <strong>246810</strong> or click below to autofill.
                  </div>

                  <button 
                    onClick={() => {
                      setUser({ loggedIn: true, email: 'marcus.vance@example.co.uk' });

                <div className="space-y-3">
                  <div className="flex justify-between items-center text-xs font-bold text-slate-500">
                    <span>STEP {wizardStep} OF 3</span>
                    <span className="text-emerald-600 bg-emerald-50 px-2 py-0.5 rounded">💾 Autosaved to session</span>

                    <div 
                      className="bg-orange-500 h-full transition-all duration-300"
                      style={{ width: `${(wizardStep / 3) * 100}%` }}

                  </div>
                </div>

                {/* Step 1: Personal Details */}
                {wizardStep === 1 && (
                  <div className="space-y-5">
                    <h3 className="text-xl font-bold text-slate-900">Applicant Details (as on Passport)</h3>
                    <div className="grid grid-cols-2 gap-4">

                        <label className="block text-xs font-bold text-slate-700 mb-1">Given Name(s)</label>
                        <input 
                          type="text" 
                          value={formData.givenName} 
                          onChange={e => setFormData({ ...formData, givenName: e.target.value })}

                      <div>
                        <label className="block text-xs font-bold text-slate-700 mb-1">Surname</label>

                          type="text" 
                          value={formData.surname} 
                          onChange={e => setFormData({ ...formData, surname: e.target.value })}
                          className="w-full border border-slate-300 rounded-lg p-2.5 text-sm"
                        />
                      </div>
                    </div>

                    <div className="grid grid-cols-2 gap-4">
                      <div>
                        <label className="block text-xs font-bold text-slate-700 mb-1">Passport Number</label>

                          type="text" 
                          value={formData.passportNumber} 
                          onChange={e => setFormData({ ...formData, passportNumber: e.target.value })}

                      <div>
                        <label className="block text-xs font-bold text-slate-700 mb-1">Date of Birth</label>

                          type="date" 
                          value={formData.dob} 
                          onChange={e => setFormData({ ...formData, dob: e.target.value })}
                          className="w-full border border-slate-300 rounded-lg p-2.5 text-sm"
                        />
                      </div>
                    </div>

                    <div>
                      <label className="block text-xs font-bold text-slate-700 mb-1">Address in India</label>
                      <input 
                        type="text" 
                        value={formData.addressInIndia} 
                        onChange={e => setFormData({ ...formData, addressInIndia: e.target.value })}
                        className="w-full border border-slate-300 rounded-lg p-2.5 text-sm"
                      />
                    </div>
                  </div>

                {/* Step 2: AI Document Check */}
                {wizardStep === 2 && (
                  <div className="space-y-6">
                    <div>
                      <h3 className="text-xl font-bold text-slate-900">Upload & AI Pre-Flight Document Inspection</h3>

                    <div className="border-2 border-dashed border-slate-300 rounded-xl p-6 text-center bg-slate-50 space-y-3">
                      <div className="text-3xl">📄</div>
                      <div className="font-bold text-sm text-slate-800">Passport Bio-Page (PDF or JPEG)</div>
                      <div className="text-xs text-slate-500">Sample bio-page loaded: GBR-481920311-VANCE.jpg (240 KB)</div>
                      
                      <button 
                        onClick={() => {
                          setIsAnalyzingDoc(true);
                          setTimeout(() => {
                            setIsAnalyzingDoc(false);
                            setDocCheckResult({
                              valid: true,
                              score: 99,
                              mrzFound: true,
                              validityMonths: 68,
                              message: "Passport bio-page verified. High clarity MRZ, >6 months validity confirmed."

                          }, 1000);
                        }}

                    <div></div>

                      onClick={() => setWizardStep(wizardStep + 1)} 
                      className="bg-orange-500 hover:bg-orange-600 text-white font-bold px-6 py-2.5 rounded-xl transition shadow"

                      onClick={() => setView('payment')} 
                      className="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-8 py-3 rounded-xl transition shadow"

                    <span>30-Day e-Tourist Visa Fee</span>
                    <span>₹2,399.00</span>
                  </div>
                  <div className="flex justify-between text-slate-500">
                    <span>Payment Gateway Surcharge</span>
                    <span className="text-emerald-600 font-bold">₹0.00 (Waived)</span>
                  </div>
                  <div className="flex justify-between border-t border-slate-200 pt-2 font-bold text-sm text-slate-900">
                    <span>Total Amount Payable</span>
                    <span className="text-orange-600">₹2,399.00</span>
                  </div>

                <div className="space-y-3 text-xs">

                      type="text"

                      className="w-full border border-slate-300 rounded-lg p-2.5 bg-slate-100 font-mono"

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">Expiry</label>

                        type="text"

                  </div>
                </div>

                <button 
                  onClick={() => {
                    setView('tracking');
                  }} 
                  className="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3.5 rounded-xl transition shadow text-sm flex items-center justify-center space-x-2"
                >
                  <span>Pay ₹2,399 & Submit Application</span>
                  <span>✓</span>
                </button>
              </div>
            )}

            {/* VIEW 6: LIVE TRACKING & TIME TRAVEL */}
            {view === 'tracking' && (
              <div className="max-w-3xl mx-auto space-y-6">
                <div className="bg-white rounded-2xl border border-slate-200 p-8 shadow-sm space-y-6">

                    <div>
                      <div className="text-xs text-slate-500">Application Number</div>
                      <div className="text-2xl font-bold font-mono text-slate-900">{appId}</div>
                    </div>
                    <div className="flex items-center space-x-3">
                      <button 
                        onClick={() => setTrackingStatus(trackingStatus === 'granted' ? 'under_review' : 'granted')}

                      <div className="text-[10px] text-emerald-700">29 Aug · 12:00 PM</div>
                    </div>

                    <div className={`p-4 rounded-xl border transition ${trackingStatus === 'granted' ? 'bg-emerald-50 border-emerald-200' : 'bg-amber-50 border-amber-300 pulse-subtle'}`}>
                      <div className={`text-xl font-bold ${trackingStatus === 'granted' ? 'text-emerald-600' : 'text-amber-600'}`}>
                        {trackingStatus === 'granted' ? '✓ 2' : '⏳ 2'}

                      <div className="text-[10px] text-slate-500">In Queue</div>
                    </div>

                    <div className={`p-4 rounded-xl border transition ${trackingStatus === 'granted' ? 'bg-emerald-50 border-emerald-200' : 'bg-slate-50 border-slate-200'}`}>
                      <div className={`text-xl font-bold ${trackingStatus === 'granted' ? 'text-emerald-600' : 'text-slate-400'}`}>
                        {trackingStatus === 'granted' ? '✓ 3' : '3'}
                      </div>
                      <div className="font-bold text-xs text-slate-900 mt-1">ETA Decision</div>
                      <div className="text-[10px] text-slate-500">{trackingStatus === 'granted' ? 'GRANTED' : 'Pending'}</div>
                    </div>
                  </div>

                  {/* Decision Banner */}
                  {trackingStatus === 'granted' ? (
                    <div className="bg-emerald-50 border-2 border-emerald-400 rounded-xl p-6 text-center space-y-4">
                      <div className="text-4xl">🎉</div>
                      <div>
                        <h3 className="text-2xl font-bold text-emerald-950">Electronic Travel Authorisation GRANTED</h3>
                        <p className="text-xs text-emerald-800 mt-1">Your 30-Day Indian e-Tourist Visa is ready. Download your official ETA certificate below.</p>
                      </div>

                      <button 
                        onClick={downloadOfficialEta}
                        className="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-8 py-3 rounded-xl transition shadow text-sm inline-flex items-center space-x-2"
                      >
                        <span>📥 Download Official ETA Pass (PNG/PDF)</span>
                      </button>
                    </div>
                  ) : (
                    <div className="bg-slate-50 border border-slate-200 rounded-xl p-5 text-xs text-slate-600 space-y-2">
                      <div className="font-bold text-slate-900 flex items-center space-x-2">
                        <span>🔍</span>
                        <span>Application under standard automated processing</span>
                      </div>
                      <p>Estimated completion in <strong>18–24 hours</strong>. You will receive an SMS and email as soon as the immigration counter completes verification.</p>
                    </div>
                  )}
                </div>
              </div>
            )}

          </main>

          {/* Fee Modal */}
          {showFeeModal && (
            <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-lg w-full p-6 space-y-4 shadow-2xl">
                <div className="flex justify-between items-center border-b pb-3">
                  <h3 className="font-bold text-lg">💰 Transparent Reciprocity Fee Directory</h3>
                  <button onClick={() => setShowFeeModal(false)} className="text-slate-400 hover:text-slate-600 font-bold">✕</button>
                </div>
                <div className="max-h-72 overflow-y-auto space-y-2 text-xs">
                  {NATIONALITIES.map(n => (
                    <div key={n.code} className="flex justify-between p-2 rounded bg-slate-50 border border-slate-100">
                      <span>{n.flag} {n.name}</span>
                      <strong className={n.fee === 0 ? 'text-emerald-600' : 'text-slate-900'}>
                        {n.fee === 0 ? '₹0 Free Waiver' : `₹${n.fee.toLocaleString()}`}
                      </strong>
                    </div>
                  ))}
                </div>
                <button onClick={() => setShowFeeModal(false)} className="w-full bg-slate-800 text-white font-bold py-2 rounded-lg text-xs">Close</button>
              </div>
            </div>
          )}

          {/* Ports Modal */}
          {showPortsModal && (
            <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-lg w-full p-6 space-y-4 shadow-2xl">
                <div className="flex justify-between items-center border-b pb-3">
                  <h3 className="font-bold text-lg">✈️ Designated Entry Airports & Seaports</h3>
                  <button onClick={() => setShowPortsModal(false)} className="text-slate-400 hover:text-slate-600 font-bold">✕</button>
                </div>
                <div className="max-h-72 overflow-y-auto space-y-2 text-xs">
                  {PORTS.map(p => (
                    <div key={p.id} className="p-2 rounded bg-slate-50 border border-slate-100 flex justify-between">
                      <span>{p.name}</span>
                      <strong className="text-orange-600 font-mono">{p.code}</strong>
                    </div>
                  ))}
                </div>
                <button onClick={() => setShowPortsModal(false)} className="w-full bg-slate-800 text-white font-bold py-2 rounded-lg text-xs">Close</button>
              </div>
            </div>
          )}

          {/* Footer */}
          <footer className="bg-[#0c1a30] text-slate-400 text-xs py-8 border-t border-slate-800">
            <div className="max-w-7xl mx-auto px-4 flex flex-col md:flex-row items-center justify-between gap-4">
              <div className="text-center md:text-left">
                <div className="font-bold text-slate-200">India eVisa 2.0 Hackathon Prototype</div>
                <div>Built for <strong>Build What Moves India</strong> · Powered by OpenAI Codex, GPT-5.6 Luna & Terra</div>
              </div>
              <div className="text-center md:text-right text-[11px] text-slate-500">
                Independent demonstration prototype. 100% simulated mock data. Not affiliated with Govt of India.
              </div>
            </div>
          </footer>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
